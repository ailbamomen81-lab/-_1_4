import 'package:flutter/material.dart';
import 'auth_service.dart';
import 'home_screen.dart';

class LoginScreen extends StatefulWidget {
  const LoginScreen({super.key});
  @override
  State<LoginScreen> createState() => _LoginScreenState();
}

class _LoginScreenState extends State<LoginScreen> {
  final pwdCtrl = TextEditingController();
  bool _hasPassword = false;
  bool _loading = true;

  @override
  void initState() {
    super.initState();
    _check();
  }

  Future<void> _check() async {
    _hasPassword = await AuthService.hasPassword();
    setState(() => _loading = false);
  }

  Future<void> _submit() async {
    final pwd = pwdCtrl.text;
    if (pwd.length < 4) {
      _snack('كلمة المرور قصيرة (4 أحرف على الأقل)');
      return;
    }
    if (_hasPassword) {
      final ok = await AuthService.checkPassword(pwd);
      if (!ok) {
        _snack('كلمة المرور خاطئة');
        return;
      }
    } else {
      await AuthService.setPassword(pwd);
    }
    if (!mounted) return;
    Navigator.pushReplacement(
        context, MaterialPageRoute(builder: (_) => const HomeScreen()));
  }

  void _snack(String m) =>
      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));

  @override
  Widget build(BuildContext context) {
    if (_loading) {
      return const Scaffold(body: Center(child: CircularProgressIndicator()));
    }
    return Scaffold(
      body: Center(
        child: SingleChildScrollView(
          padding: const EdgeInsets.all(24),
          child: Column(
            mainAxisAlignment: MainAxisAlignment.center,
            children: [
              const Icon(Icons.store, size: 100, color: Colors.green),
              const SizedBox(height: 20),
              Text(
                _hasPassword ? 'أدخل كلمة المرور' : 'أنشئ كلمة مرور',
                style: const TextStyle(
                    fontSize: 22, fontWeight: FontWeight.bold),
              ),
              const SizedBox(height: 24),
              TextField(
                controller: pwdCtrl,
                obscureText: true,
                keyboardType: TextInputType.number,
                textAlign: TextAlign.center,
                style: const TextStyle(fontSize: 20, letterSpacing: 8),
                decoration: const InputDecoration(
                  border: OutlineInputBorder(),
                  hintText: '****',
                ),
              ),
              const SizedBox(height: 20),
              SizedBox(
                width: double.infinity,
                height: 50,
                child: ElevatedButton.icon(
                  onPressed: _submit,
                  icon: const Icon(Icons.login),
                  label: Text(_hasPassword ? 'دخول' : 'حفظ ودخول'),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}
