class EditProductScreen extends StatefulWidget {
  final Map<String, dynamic> product;
  const EditProductScreen({super.key, required this.product});

  @override
  State<EditProductScreen> createState() => _EditProductScreenState();
}

class _EditProductScreenState extends State<EditProductScreen> {
  late TextEditingController nameCtrl;
  late TextEditingController priceCtrl;
  late TextEditingController qtyCtrl;
  late TextEditingController barcodeCtrl;

  @override
  void initState() {
    super.initState();
    nameCtrl = TextEditingController(text: widget.product['name']);
    priceCtrl = TextEditingController(text: '${widget.product['price']}');
    qtyCtrl = TextEditingController(text: '${widget.product['quantity']}');
    barcodeCtrl =
        TextEditingController(text: widget.product['barcode'] ?? '');
  }

  Future<void> _save() async {
    final name = nameCtrl.text.trim();
    final price = double.tryParse(priceCtrl.text) ?? 0;
    final qty = int.tryParse(qtyCtrl.text) ?? 0;
    final barcode = barcodeCtrl.text.trim();
    if (name.isEmpty || price <= 0 || qty < 0) {
      ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('بيانات غير صحيحة')));
      return;
    }
    await DBHelper.updateProduct(
      widget.product['id'],
      name,
      price,
      qty,
      barcode: barcode.isEmpty ? null : barcode,
    );
    if (!mounted) return;
    Navigator.pop(context, true);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('تعديل المنتج')),
      body: Padding(
        padding: const EdgeInsets.all(16),
