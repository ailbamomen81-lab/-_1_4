            const SizedBox(height: 12),
            TextField(
              controller: qtyCtrl,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                  labelText: 'الكمية', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: barcodeCtrl,
              decoration: const InputDecoration(
                  labelText: 'الباركود', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 20),
            SizedBox(
              width: double.infinity,
              height: 50,
              child: ElevatedButton.icon(
                onPressed: _save,
                icon: const Icon(Icons.save),
                label: const Text('حفظ التعديلات'),
              ),
            ),
          ],
        ),
      ),
    );
  }
}
import 'package:flutter/material.dart';
import 'package:intl/intl.dart';
import 'db_helper.dart';
import 'invoice_service.dart';
import 'barcode_screen.dart';

class CartItem {
  Map<String, dynamic> product;
  int qty;
  CartItem(this.product, this.qty);
  double get total => (product['price'] as num).toDouble() * qty;
}

class SalesScreen extends StatefulWidget {
  const SalesScreen({super.key});
  @override
  State<SalesScreen> createState() => _SalesScreenState();
}

class _SalesScreenState extends State<SalesScreen> {
  List<Map<String, dynamic>> products = [];
  final List<CartItem> cart = [];

  @override
  void initState() {
    super.initState();
    _load();
  }

  Future<void> _load() async {
    final p = await DBHelper.getProducts();
    setState(() => products = p.where((e) => e['quantity'] > 0).toList());
  }

  double get cartTotal => cart.fold(0, (s, e) => s + e.total);

  void _addToCart(Map<String, dynamic> p) {
    final idx = cart.indexWhere((e) => e.product['id'] == p['id']);
    if (idx != -1) {
      if (cart[idx].qty < p['quantity']) {
        setState(() => cart[idx].qty++);
      } else {
        _snack('الكمية المتاحة ${p['quantity']} فقط');
      }
    } else {
      setState(() => cart.add(CartItem(p, 1)));
    }
  }

  Future<void> _scan() async {
    final barcode = await Navigator.push<String>(
      context,
      MaterialPageRoute(builder: (_) => const BarcodeScreen()),
    );
    if (barcode == null) return;
    final p = await DBHelper.getProductByBarcode(barcode);
    if (p == null) {
      _snack('لا يوجد منتج بهذا الباركود');
      return;
    }
    if ((p['quantity'] as int) <= 0) {
      _snack('الكمية غير متوفرة');
      return;
    }
    _addToCart(p);
    _snack('تمت إضافة ${p['name']}');
  }

  Future<void> _checkout() async {
    if (cart.isEmpty) {
      _snack('السلة فارغة');
      return;
    }
    for (final item in cart) {
      await DBHelper.insertSale(
          item.product['name'], item.qty, item.total);
      await DBHelper.reduceStock(item.product['id'], item.qty);
    }
    await InvoiceService.generateAndShare(
      cart
          .map((e) => {
                'name': e.product['name'],
                'qty': e.qty,
                'price': e.product['price'],
                'total': e.total,
              })
          .toList(),
      cartTotal,
    );
    setState(() => cart.clear());
    _load();
    _snack('تم إتمام البيع');
  }

  void _snack(String m) =>
      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));

  @override
  Widget build(BuildContext context) {
    final df = NumberFormat('#,##0.00');
    return Scaffold(
      appBar: AppBar(
        title: const Text('شاشة البيع'),
        actions: [
          IconButton(
            icon: const Icon(Icons.qr_code_scanner),
            onPressed: _scan,
            tooltip: 'مسح باركود',
          ),
        ],
      ),
      body: Column(
        children: [
          Expanded(
            flex: 3,
            child: products.isEmpty
                ? const Center(child: Text('لا توجد منتجات متوفرة'))
                : GridView.builder(
                    padding: const EdgeInsets.all(8),
                    gridDelegate:
                        const SliverGridDelegateWithFixedCrossAxisCount(
                      crossAxisCount: 2,
                      childAspectRatio: 2.2,
                      crossAxisSpacing: 8,
                      mainAxisSpacing: 8,
                    ),
                    itemCount: products.length,
                    itemBuilder: (_, i) {
                      final p = products[i];
                      return InkWell(
                        onTap: () => _addToCart(p),
                        child: Card(
                          color: Colors.green.shade50,
                          child: Padding(
                            padding: const EdgeInsets.all(8),
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Text(p['name'],
                                    style: const TextStyle(
                                        fontWeight: FontWeight.bold)),
                                Text('${p['price']}',
                                    style: const TextStyle(
                                        color: Colors.green)),
                                Text('متاح: ${p['quantity']}',
                                    style: const TextStyle(
                                        fontSize: 12,
                                        color: Colors.grey)),
                              ],
                            ),
                          ),
                        ),
                      );
                    },
                  ),
          ),
          const Divider(height: 1),
          Expanded(
            flex: 2,
            child: Column(
              children: [
                Expanded(
                  child: cart.isEmpty
                      ? const Center(child: Text('السلة فارغة'))
                      : ListView.builder(
                          itemCount: cart.length,
                          itemBuilder: (_, i) {
                            final it = cart[i];
                            return ListTile(
                              dense: true,
                              title: Text(it.product['name']),
                              subtitle: Text(
                                  '${it.qty} × ${it.product['price']} = ${df.format(it.total)}'),
                              trailing: IconButton(
                                icon: const Icon(Icons.close,
                                    color: Colors.red),
                                onPressed: () =>
                                    setState(() => cart.removeAt(i)),
                              ),
                            );
                          },
                        ),
                ),
                Container(
                  padding: const EdgeInsets.all(12),
                  color: Colors.green.shade100,
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Text('الإجمالي: ${df.format(cartTotal)}',
                          style: const TextStyle(
                              fontSize: 18, fontWeight: FontWeight.bold)),
                      ElevatedButton.icon(
                        onPressed: _checkout,
                        icon: const Icon(Icons.check),
                        label: const Text('إتمام البيع'),
                      ),
                    ],
                  ),
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }
}
import 'package:flutter/material.dart';
import 'package:mobile_scanner/mobile_scanner.dart';

class BarcodeScreen extends StatefulWidget {
  const BarcodeScreen({super.key});
  @override
  State<BarcodeScreen> createState() => _BarcodeScreenState();
}

class _BarcodeScreenState extends State<BarcodeScreen> {
  final controller = MobileScannerController();
  bool _handled = false;

  @override
  void dispose() {
    controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('مسح الباركود'),
        actions: [
          IconButton(
            icon: const Icon(Icons.flash_on),
            onPressed: () => controller.toggleTorch(),
          ),
        ],
      ),
      body: MobileScanner(
        controller: controller,
        onDetect: (capture) {
          if (_handled) return;
          final barcodes = capture.barcodes;
          if (barcodes.isEmpty) return;
          final code = barcodes.first.rawValue;
          if (code != null) {
            _handled = true;
            Navigator.pop(context, code);
          }
        },
      ),
    );
  }
}
