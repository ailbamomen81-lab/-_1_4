import 'package:path/path.dart';
import 'package:sqflite/sqflite.dart';

class DBHelper {
  static Database? _db;

  static Future<Database> get database async {
    if (_db != null) return _db!;
    _db = await _initDB();
    return _db!;
  }

  static Future<String> get dbPath async =>
      join(await getDatabasesPath(), 'sales.db');

  static void resetInstance() => _db = null;

  static Future<Database> _initDB() async {
    final path = await dbPath;
    return openDatabase(
      path,
      version: 1,
      onCreate: (db, v) async {
        await db.execute('''
          CREATE TABLE products(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT NOT NULL,
            price REAL NOT NULL,
            quantity INTEGER NOT NULL,
            barcode TEXT
          )
        ''');
        await db.execute('''
          CREATE TABLE sales(
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            productName TEXT NOT NULL,
            quantity INTEGER NOT NULL,
            totalPrice REAL NOT NULL,
            date INTEGER NOT NULL
          )
        ''');
      },
    );
  }

  // ===== المنتجات =====
  static Future<int> insertProduct(String name, double price, int qty,
      {String? barcode}) async {
    final db = await database;
    return db.insert('products', {
      'name': name,
      'price': price,
      'quantity': qty,
      'barcode': barcode,
    });
  }

  static Future<void> updateProduct(
      int id, String name, double price, int qty, {String? barcode}) async {
    final db = await database;
    await db.update(
      'products',
      {'name': name, 'price': price, 'quantity': qty, 'barcode': barcode},
      where: 'id = ?',
      whereArgs: [id],
    );
  }

  static Future<List<Map<String, dynamic>>> getProducts() async {
    final db = await database;
    return db.query('products', orderBy: 'id DESC');
  }

  static Future<Map<String, dynamic>?> getProductByBarcode(
      String barcode) async {
    final db = await database;
    final r =
        await db.query('products', where: 'barcode = ?', whereArgs: [barcode]);
    return r.isEmpty ? null : r.first;
  }

  static Future<void> deleteProduct(int id) async {
    final db = await database;
    await db.delete('products', where: 'id = ?', whereArgs: [id]);
  }

  static Future<void> reduceStock(int id, int qty) async {
    final db = await database;
    await db.rawUpdate(
        'UPDATE products SET quantity = quantity - ? WHERE id = ?',
        [qty, id]);
  }

  // ===== المبيعات =====
  static Future<int> insertSale(String name, int qty, double total) async {
    final db = await database;
    return db.insert('sales', {
      'productName': name,
      'quantity': qty,
      'totalPrice': total,
      'date': DateTime.now().millisecondsSinceEpoch,
    });
  }

  static Future<List<Map<String, dynamic>>> getSales(
      {DateTime? from, DateTime? to}) async {
    final db = await database;
    if (from != null && to != null) {
      return db.query('sales',
          where: 'date BETWEEN ? AND ?',
          whereArgs: [
            from.millisecondsSinceEpoch,
            to.millisecondsSinceEpoch,
          ],
          orderBy: 'date DESC');
    }
    return db.query('sales', orderBy: 'date DESC');
  }

  static Future<double> totalRevenue({DateTime? from, DateTime? to}) async {
    final db = await database;
    final result = await db.rawQuery(
      from != null && to != null
          ? 'SELECT SUM(totalPrice) as s FROM sales WHERE date BETWEEN ? AND ?'
          : 'SELECT SUM(totalPrice) as s FROM sales',
      from != null && to != null
          ? [from.millisecondsSinceEpoch, to.millisecondsSinceEpoch]
          : [],
    );
    final val = result.first['s'];
    return val == null ? 0.0 : (val as num).toDouble();
  }

  static Future<Map<String, dynamic>?> topProduct() async {
    final db = await database;
    final r = await db.rawQuery('''
      SELECT productName, SUM(quantity) as totalQty, SUM(totalPrice) as revenue
      FROM sales GROUP BY productName ORDER BY totalQty DESC LIMIT 1
    ''');
    return r.isEmpty ? null : r.first;
  }

  static Future<List<Map<String, dynamic>>> dailySalesLast7Days() async {
    final db = await database;
    final now = DateTime.now();
    final List<Map<String, dynamic>> result = [];
    for (int i = 6; i >= 0; i--) {
      final day = DateTime(now.year, now.month, now.day - i);
      final next = day.add(const Duration(days: 1));
      final r = await db.rawQuery(
        'SELECT SUM(totalPrice) as s FROM sales WHERE date BETWEEN ? AND ?',
        [day.millisecondsSinceEpoch, next.millisecondsSinceEpoch],
      );
      final v = r.first['s'];
      result.add({
        'day': day,
        'total': v == null ? 0.0 : (v as num).toDouble(),
      });
    }
    return result;
  }
}
import 'dart:convert';
import 'package:crypto/crypto.dart';
import 'package:shared_preferences/shared_preferences.dart';

class AuthService {
  static const _key = 'app_password';

  static String _hash(String pwd) =>
      sha256.convert(utf8.encode(pwd)).toString();

  static Future<bool> hasPassword() async {
    final prefs = await SharedPreferences.getInstance();
    return prefs.containsKey(_key);
  }

  static Future<void> setPassword(String pwd) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString(_key, _hash(pwd));
  }

  static Future<bool> checkPassword(String pwd) async {
    final prefs = await SharedPreferences.getInstance();
    return prefs.getString(_key) == _hash(pwd);
  }

  static Future<void> removePassword() async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.remove(_key);
  }
}
import 'package:intl/intl.dart';
import 'package:pdf/pdf.dart';
import 'package:pdf/widgets.dart' as pw;
import 'package:printing/printing.dart';

class InvoiceService {
  static Future<void> generateAndShare(
      List<Map<String, dynamic>> items, double total) async {
    final pdf = pw.Document();
    final df = NumberFormat('#,##0.00');
    final dateStr = DateFormat('yyyy-MM-dd HH:mm').format(DateTime.now());

    pdf.addPage(
      pw.MultiPage(
        pageFormat: PdfPageFormat.a5,
        build: (context) => [
          pw.Header(
            level: 0,
            child: pw.Center(
              child: pw.Text('فاتورة مبيعات',
                  style: pw.TextStyle(
                      fontSize: 22, fontWeight: pw.FontWeight.bold)),
            ),
          ),
          pw.Text('التاريخ: $dateStr'),
          pw.SizedBox(height: 12),
          pw.TableHelper.fromTextArray(
            headers: ['المنتج', 'الكمية', 'السعر', 'الإجمالي'],
            data: items
                .map((e) => [
                      e['name'].toString(),
                      e['qty'].toString(),
                      df.format(e['price']),
                      df.format(e['total']),
                    ])
                .toList(),
            cellAlignment: pw.Alignment.center,
          ),
          pw.SizedBox(height: 12),
          pw.Align(
            alignment: pw.Alignment.centerRight,
            child: pw.Text('الإجمالي: ${df.format(total)}',
                style: pw.TextStyle(
                    fontSize: 16, fontWeight: pw.FontWeight.bold)),
          ),
        ],
      ),
    );

    await Printing.layoutPdf(
      onLayout: (format) => pdf.save(),
      name: 'invoice_$dateStr.pdf',
    );
  }
}
import 'dart:io';
import 'package:file_picker/file_picker.dart';
import 'package:path/path.dart';
import 'package:path_provider/path_provider.dart';
import 'package:share_plus/share_plus.dart';
import 'db_helper.dart';

class BackupService {
  static Future<void> exportDatabase() async {
    final dbPath = await DBHelper.dbPath;
    final dbFile = File(dbPath);
    if (!await dbFile.exists()) throw Exception('قاعدة البيانات غير موجودة');

    final dir = await getTemporaryDirectory();
    final stamp = DateTime.now().millisecondsSinceEpoch;
    final backupFile = File(join(dir.path, 'sales_backup_$stamp.db'));
    await dbFile.copy(backupFile.path);

    await Share.shareXFiles(
      [XFile(backupFile.path)],
      subject: 'نسخة احتياطية - برنامج المبيعات',
    );
  }

  static Future<bool> importDatabase() async {
    final result = await FilePicker.platform.pickFiles();
    if (result == null || result.files.single.path == null) return false;

    final picked = File(result.files.single.path!);

    final db = await DBHelper.database;
    await db.close();
    DBHelper.resetInstance();

    final dbPath = await DBHelper.dbPath;
    await picked.copy(dbPath);
    return true;
  }
}
